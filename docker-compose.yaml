services:
  # Shell / ad-hoc tasks only — not started by `docker compose up` (avoids extra IRB holding DB).
  # Image is Alpine: use `sh`, not `bash` (e.g. `docker compose --profile tools run --rm base sh`).
  base: &base
    image: chatwoot/chatwoot:latest  # Используем готовый образ вместо сборки
    profiles: ["tools"]
    command: ["sh"]
    # Блок build: полностью удаляем или закомментируем (поставь # перед строками)
    # build:
    #   context: .
    #   dockerfile: ./docker/Dockerfile
    #   args:
    #     BUNDLE_WITHOUT: ''
    #     EXECJS_RUNTIME: 'Node'
    #     RAILS_ENV: 'production' # В проде всегда используй production
    #     RAILS_SERVE_STATIC_FILES: 'true'
    env_file: .env

  # Do not inherit `profiles: [tools]` from *base — otherwise `docker compose up` skips rails/sidekiq/vite.
  rails:
    <<: *base
    profiles: []
    build:
      context: .
      dockerfile: ./docker/dockerfiles/rails.Dockerfile
    image: chatwoot/chatwoot:latest
    volumes:
      - ./:/app:delegated
      - node_modules:/app/node_modules
      - packs:/app/public/packs
      - cache:/app/tmp/cache
      - bundle:/gems
    # Do not list sidekiq/vite here: `docker compose run rails …` would start them and they
    # open PostgreSQL connections, which breaks `db:drop` / `db:reset`. Full stack still starts
    # with `docker compose up` (all services are defined below).
    depends_on:
      - postgres
      - redis
      - mailhog
    ports:
      - 3000:3000
    env_file: .env
    environment:
      # Nginx проксирует всё на Puma — без этого Rails не отдаёт public/vite, favicon, manifest (RoutingError).
      - RAILS_SERVE_STATIC_FILES=true
      - VITE_DEV_SERVER_HOST=vite
      - NODE_ENV=production
      - RAILS_ENV=production
      - GEM_HOME=/gems
      - GEM_PATH=/gems
      # Vite autoBuild / bin/vite needs more than default ~2GB Node heap on large frontends (avoids OOM + missing manifest)
      - "NODE_OPTIONS=--max-old-space-size=8192 --openssl-legacy-provider"
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]

  sidekiq:
    <<: *base
    profiles: []
    image: chatwoot/chatwoot:latest
    volumes:
      - ./:/app:delegated
      - node_modules:/app/node_modules
      - packs:/app/public/packs
      - cache:/app/tmp/cache
      - bundle:/gems
    depends_on:
      - postgres
      - redis
      - mailhog
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - GEM_HOME=/gems
      - GEM_PATH=/gems
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]

  vite:
    <<: *base
    profiles: []
    build:
      context: .
      dockerfile: ./docker/dockerfiles/vite.Dockerfile
    image: chatwoot-vite:development
    volumes:
      - ./:/app:delegated
      - node_modules:/app/node_modules
      - packs:/app/public/packs
      - cache:/app/tmp/cache
      - bundle:/gems
    ports:
      - "3036:3036" # Vite dev server
    environment:
      - VITE_DEV_SERVER_HOST=0.0.0.0
      - NODE_ENV=production
      - RAILS_ENV=production
      - GEM_HOME=/gems
      - GEM_PATH=/gems
      - "NODE_OPTIONS=--max-old-space-size=8192 --openssl-legacy-provider"
    entrypoint: docker/entrypoints/vite.sh
    command: bin/vite build --clear --mode=production

  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    ports:
      - '5432:5432'
    volumes:
      - postgres:/data/postgres
    env_file: .env
    environment:
      - POSTGRES_DB=chatwoot
      - POSTGRES_USER=postgres
      # Must match POSTGRES_PASSWORD in .env so Rails and init use the same secret
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-chatwoot}

  redis:
    image: redis:alpine
    restart: always
    command: ["sh", "-c", "redis-server --requirepass \"$REDIS_PASSWORD\""]
    env_file: .env
    volumes:
      - redis:/data/redis
    ports:
      - '6379:6379'

  mailhog:
    image: mailhog/mailhog
    ports:
      - 1025:1025
      - 8025:8025

volumes:
  postgres:
  redis:
  packs:
  node_modules:
  cache:
  bundle:
