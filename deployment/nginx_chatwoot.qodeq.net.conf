# Nginx reverse proxy for Chatwoot at https://chatwoot.qodeq.net
#
# Prerequisites on the VPS:
#   1. DNS A-record: chatwoot.qodeq.net -> this server's public IP
#   2. Docker (or Rails) listening on 127.0.0.1:3000 (docker compose: ports "3000:3000")
#   3. SSL certificates (Let's Encrypt) — see deployment/setup_https_qodeq.sh
#
# Install:
#   sudo cp deployment/nginx_chatwoot.qodeq.net.conf /etc/nginx/sites-available/chatwoot.qodeq.net
#   sudo ln -sf /etc/nginx/sites-available/chatwoot.qodeq.net /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream chatwoot_rails {
  server 127.0.0.1:3000;
  keepalive 32;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  listen [::]:80;
  server_name chatwoot.qodeq.net;

  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location / {
    return 301 https://chatwoot.qodeq.net$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name chatwoot.qodeq.net;

  underscores_in_headers on;

  # After: sudo certbot certonly --nginx -d chatwoot.qodeq.net
  # Or use certbot --nginx which may patch these paths automatically
  ssl_certificate     /etc/letsencrypt/live/chatwoot.qodeq.net/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/chatwoot.qodeq.net/privkey.pem;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  client_max_body_size 0;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;

  location / {
    proxy_pass http://chatwoot_rails;
    proxy_redirect off;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
